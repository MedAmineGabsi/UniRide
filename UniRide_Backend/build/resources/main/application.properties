spring.application.name=UniRide_Backend

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true

# --- Cache (Redis) ---
spring.cache.type=none
management.health.redis.enabled=false
spring.data.redis.repositories.enabled=false

# --- Sécurité : Microsoft Entra ID (McGill) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID:changeme}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_API_CLIENT_ID:changeme}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# --- Swagger UI (springdoc) ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Logs (dev) ---
logging.level.ca.mcgill.ecse428=DEBUG
logging.level.org.springframework.security=INFO